name: Build iOS (unsigned IPA)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Repo chưa có thư mục ios/ thì tự tạo (bundle id: com.example.duckpacket).
      # Sau khi build xanh, nên commit thư mục ios/ vào repo để bundle id cố định.
      - name: Create ios/ if missing
        run: |
          if [ ! -d ios ]; then
            flutter create --platforms=ios --org com.example --project-name duckpacket .
          fi

      - run: flutter pub get

      # Thử lại tối đa 3 lần (lỗi mạng khi tải CocoaPods).
      - name: Build iOS (no codesign)
        run: |
          for i in 1 2 3; do
            flutter build ios --release --no-codesign && exit 0
            echo "Build failed (attempt $i), retrying in 40s..."
            sleep 40
          done
          exit 1

      # IPA = thư mục Payload/Runner.app nén zip. Chưa ký: cần ký lại khi cài (Sideloadly / AltStore).
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr DuckPacket-unsigned.ipa Payload
          ls -lh DuckPacket-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: duckpacket-ios-ipa
          path: DuckPacket-unsigned.ipa

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DuckPacket-unsigned.ipa
