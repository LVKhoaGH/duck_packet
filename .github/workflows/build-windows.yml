name: Build Windows portable

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Create the windows/ folder if the repo does not have it yet
        shell: bash
        run: |
          if [ ! -d windows ]; then flutter create --platforms=windows .; fi

      - run: flutter pub get

      - run: flutter build windows --release

      - name: Make the portable zip (bundles the VC++ runtime DLLs)
        shell: pwsh
        run: |
          $rel = "build/windows/x64/runner/Release"
          foreach ($d in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$d" $rel -ErrorAction SilentlyContinue
          }
          Compress-Archive -Path "$rel/*" -DestinationPath DuckPacket-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: duckpacket-windows
          path: DuckPacket-windows.zip

      - name: Attach to the GitHub Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DuckPacket-windows.zip
