name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure mascot folder exists
        run: mkdir -p assets/mascot

      - name: Get dependencies
        run: flutter pub get

      - name: Patch all plugins compileSdk to 36
        run: |
          find ~/.pub-cache/hosted/pub.dev/ -name "build.gradle" -exec sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 36/g' {} + || true
          find ~/.pub-cache/hosted/pub.dev/ -name "build.gradle.kts" -exec sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 36/g' {} + || true

      - name: Configure Gradle properties
        run: |
          mkdir -p android
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
          echo "android.disableMinifyLocalDependenciesForLibraries=true" >> android/gradle.properties

      - name: Build APK Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuckPacket-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
